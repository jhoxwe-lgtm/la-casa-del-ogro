name: quality

on:
  push:
    branches:
      - main
      - "quality/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pytest and branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile application and tests
        run: python -m compileall -q casa_ogro tests
      - name: Run automated tests and branch coverage
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -v --cov=casa_ogro.rules --cov-branch --cov-report=term-missing 2>&1 | tee evidence/pytest_results_v4.txt
      - name: Upload Pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: evidence/pytest_results_v4.txt
          if-no-files-found: warn
          retention-days: 30
